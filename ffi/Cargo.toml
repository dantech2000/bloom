[package]
name = "bloom-ffi"
version.workspace = true
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-or-later"
description = "The Swift bindings of bloom-core for the native iOS app (UniFFI)"
publish = false

# The iOS app links the cdylib (a framework of its own, so its Rust
# runtime stays private next to MPVKit's Libdovi); `lib` is for the
# bindings generator, which reads the library's metadata on the Mac.
[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/bin/uniffi-bindgen-swift.rs"

# `cast-mock`: the fake Chromecast of core, for the app's tests
# (BLOOM_CHROMECAST_MOCK). Personal builds keep it: it runs only when asked.
[features]
default = ["cast-mock"]
cast-mock = ["bloom-core/cast-mock"]

[dependencies]
bloom-core = { path = "../core", default-features = false }
uniffi = { version = "0.32", features = ["cli"] }
async-channel = "2"
anyhow = "1"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
