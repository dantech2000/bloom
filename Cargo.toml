[package]
name = "bloom"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-or-later"
description = "A native Jellyfin client built with GPUI and libmpv"

[dependencies]
web-time = "1.1"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.4", features = ["font-kit"] }
gpui-icons = { git = "https://github.com/devaryakjha/gpui-icons", rev = "01ac07dd83e97f9d6a3526466413732fbdfc2975" }
gpui-kit = { version = "=0.6.1", default-features = false }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "3", features = ["json"] }
async-channel = "2"
base64 = "0.22"
# The socket of the server: SyncPlay commands and live events. The TLS
# stack is the one ureq already uses (rustls with ring).
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
libmpv2 = "6"
image = { version = "0.25", default-features = false }
smallvec = "1"
# The version GPUI already builds; draws SVG images to pixels.
resvg = "0.46"
libmpv2-sys = "4"
core-video = "0.5"
core-foundation = "0.10"
jiff = "0.2"
raw-window-handle = "0.6"
# Objective-C blocks, for the handlers of the media keys (src/nowplaying.rs).
block = "0.1"

[dev-dependencies]
gpui-kit = { version = "=0.6.1", default-features = false, features = ["test-support"] }

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

# The Metal renderer with a backdrop blur pass added (see vendor/gpui-pre-apple).
[patch.crates-io]
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
